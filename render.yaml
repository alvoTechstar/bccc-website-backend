databases:
  - name: bccc-db
    databaseName: bccc
    user: bccc
    plan: free

services:
  - type: web
    name: bccc-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: bccc-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      # ---- M-Pesa: SANDBOX (testing). Go-live = replace the 5 values
      # below with the production block at the bottom of this file,
      # commit, push. Blueprint sync overwrites dashboard edits to
      # `value:` keys, so keep go-live values HERE, not in the dashboard.
      - key: MPESA_API_URL
        value: https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
      - key: MPESA_AUTH_URL
        value: https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
      - key: MPESA_QUERY_URL
        value: https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PAYBILL_NUMBER
        value: 174379
      - key: MPESA_PASSKEY
        sync: false
      # ---- M-Pesa: PRODUCTION (go-live). Swap the 5 values above with
      # these after Daraja approves the live app, then commit + push:
      # MPESA_API_URL=https://api.safaricom.co.ke/mpesa/stkpush/v1/processrequest
      # MPESA_AUTH_URL=https://api.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
      # MPESA_QUERY_URL=https://api.safaricom.co.ke/mpesa/stkpushquery/v1/query
      # MPESA_CONSUMER_KEY=<live key from Daraja>   (dashboard, sync: false)
      # MPESA_CONSUMER_SECRET=<live secret>          (dashboard, sync: false)
      # MPESA_PAYBILL_NUMBER=<real till/paybill>
      # MPESA_PASSKEY=<production passkey>
      - key: YOUR_APP_URL
        value: https://bccc-website-backend.onrender.com
      - key: MPESA_CALLBACK_URL
        value: https://bccc-website-backend.onrender.com/api/mpesa/callback
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_GRAPH_VERSION
        value: v22.0
      - key: FACEBOOK_SYNC_INTERVAL_MINUTES
        value: 60
      - key: SYNC_SECRET
        sync: false
